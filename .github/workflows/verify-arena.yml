name: Verify THE WORLD clients

on:
  push:
    branches:
      - feature/arena-immersion-without-grimoire

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web client
        run: cd packages/web && bun run build
      - name: Typecheck Expo client
        run: bunx tsc --noEmit -p packages/mobile/tsconfig.json
